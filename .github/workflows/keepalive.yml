name: Keep backend awake
# Render free plan sleeps the backend after 15 idle minutes; Discord needs a reply within 3s.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 60 https://seds-tools.onrender.com/api/ || true
